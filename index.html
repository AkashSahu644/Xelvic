<!doctype html>
<html lang="en">

    <!-- Icons -->
    <link rel="icon" href="/favicon.png" type="image/png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary meta (per-route tags are injected by useSEO) -->
    <title>Xelvic — Chat. Call. Vibe.</title>
    <meta

    <meta property="og:site_name" content="Xelvic" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xelvic — Chat. Call. Vibe." />
    <meta
      property="og:description"
      content="One app for messaging, voice & video calls, moments, live rooms, music and more."
    />
    <meta property="og:url" content="https://xelvic.app/" />
    <meta property="og:image" content="https://xelvic.app/og/xelvic-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@xelvic" />
    <meta name="twitter:title" content="Xelvic — Chat. Call. Vibe." />
    <meta
      name="twitter:description"
      content="One app for messaging, voice & video calls, moments, live rooms, music and more."
    />
    <meta name="twitter:image" content="https://xelvic.app/og/xelvic-og.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"

    <script type="application/ld+json">

        "@type": "Organization",
        "name": "Xelvic",

        "logo": "https://xelvic.app/favicon-512x512.png",

          "https://x.com/xelvic",

          "https://youtube.com/@xelvic",
