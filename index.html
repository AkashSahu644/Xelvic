<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff5f9" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="icon" sizes="32x32" href="/favicon-32x32.png" type="image/png" />
    <link rel="icon" sizes="16x16" href="/favicon-16x16.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Xelvic" />
    <meta name="application-name" content="Xelvic" />

    <!--
      Per-route head.

      There is deliberately no canonical, robots, Open Graph or Twitter tag
      written here, and no structured data either — not because they are
      unwanted but because there is exactly one place that decides them:
      `src/seo/routes.ts`.

      Two things read that table and write the head from it. The build runs
      `scripts/prerender.mjs`, which writes a real document per route into
      `dist/`, and that is what production serves. The dev server runs the
      `seo-head` plugin in `vite.config.ts`, which swaps the head on the HTML
      it serves, so a local link preview matches the deployed one. The browser
      reads the same table through `useSEO`. A second copy of any of it here
      would be a second answer to the same question, and the two would drift —
      which is precisely how every route ended up sharing one share card.

      Nothing below may spell a tag name inside a comment. This comment used to
      say, in prose, that the build replaces the title tag — and a share-link
      scraper looking for the first title tag found that one, inside the
      comment, and produced a card reading "below with the whole route block
      for every route in that table". Write about the tags in words, or not at
      all.
    -->
    <title>Xelvic — Chat, Spark, Vibe &amp; more</title>
    <meta name="description" content="Xelvic is a free app for chat, voice and video calls, Moments, live rooms, Drops and Vibes, music and Sparks — with 50+ themes and a private, encrypted Vault." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Structured data is not written by hand here either. The company, the site
      and the app are built by `src/data/jsonld.ts` and baked into every
      route's document by `scripts/prerender.mjs`, so the node identifiers and
      the claims they make come from one place and cannot contradict the page
      they sit on. A hand-written copy of the same graph used to live in this
      file; it was a second description of the same three entities, and the two
      had already drifted apart from `jsonld.ts`.
    -->
  </head>
  <body>
    <div id="root"></div>

    <!--
      The no-JavaScript fallback.

      This is not a crawler trick and it is not hidden from anybody: with
      scripting off, this is genuinely all a visitor would otherwise get, and a
      blank page is a worse answer for a person than a plain one. It says the
      same things the rendered home page says, in the same words, and links to
      the same pages — nothing here is written for a machine that a reader
      would not also be told.
    -->
    <noscript>
      <div style="max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.65; color: #3a0a24">
        <h1 style="font-size: 1.9rem; line-height: 1.15; margin: 0 0 0.5rem">Xelvic — Chat, Spark, Vibe &amp; more</h1>
        <p style="font-size: 1.05rem; margin: 0 0 1.5rem">
          Xelvic is a free social app for iOS, Android and the web that puts messaging, voice and
          video calls, moments, live rooms, short video and music in one place. It is built around
          close groups rather than follower counts.
        </p>

        <h2 style="font-size: 1.15rem; margin: 1.75rem 0 0.5rem">What it does</h2>
        <ul style="margin: 0; padding-left: 1.15rem">
          <li><strong>Messaging</strong> — one-to-one and group chat with channels, voice notes, media, documents and an offline outbox.</li>
          <li><strong>Voice &amp; video calls</strong> — peer-to-peer over WebRTC, with encrypted media and a full call history.</li>
          <li><strong>Moments &amp; Memories</strong> — posts with text, polls and music that last 24 hours, then file themselves away.</li>
          <li><strong>Live &amp; Rooms</strong> — go live by camera or text, or open an audio room and hand out the microphones.</li>
          <li><strong>Drops &amp; Vibes</strong> — photo posts and short-video reels, with feels and private notes on each one.</li>
          <li><strong>Audio &amp; music</strong> — charts, playlists, offline saving, and sharing a track straight into a chat.</li>
          <li><strong>Themes &amp; Drip</strong> — 50+ themes that restyle the whole app, chat wallpapers, and wearables for your profile.</li>
          <li><strong>Sparks</strong> — a streak for every day two people actually talk.</li>
          <li><strong>Private Vault</strong> — an encrypted, code-locked space for the conversations you want out of the way.</li>
        </ul>

        <h2 style="font-size: 1.15rem; margin: 1.75rem 0 0.5rem">The essentials</h2>
        <ul style="margin: 0; padding-left: 1.15rem">
          <li>Free to use. Sparks are spent on cosmetic themes and looks, never on features.</li>
          <li>Available on iOS, Android and any modern browser. Minimum age 13.</li>
          <li>Contacts are matched on your device — your address book is never uploaded.</li>
        </ul>

        <h2 style="font-size: 1.15rem; margin: 1.75rem 0 0.5rem">Where to go next</h2>
        <ul style="margin: 0; padding-left: 1.15rem">
          <li><a href="/features">All features</a></li>
          <li><a href="/how-it-works">How it works</a></li>
          <li><a href="/download">Download Xelvic</a></li>

        <p style="margin: 1.75rem 0 0; font-size: 0.95rem">
          Signing in to an existing account: <a href="https://web.xelvic.com">web.xelvic.com</a>
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
