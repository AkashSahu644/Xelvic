        <h1 style="font-size:1.9rem;line-height:1.15;margin:0 0 0.5rem">The story behind our 18 themes</h1>
        <p style="font-size:1.05rem;margin:0 0 1.25rem">From Kitsune to Mecha — how we design a world you can wear on your whole app.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem">Design at Xelvic · 2026-09-15 · 6 min read</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem">A theme is more than a color swap. Each one re-skins chat, calls, moments, live and your profile into a single, consistent world.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem">We start with a mood, build a mascot pose for it, then paint every surface so the moment you switch, the whole app changes character.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem">Keep a spark going and new themes open up — a small reward for staying close to your people.</p>
