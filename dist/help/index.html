      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I create a Xelvic account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Download Xelvic, enter your phone number and confirm the one-time code we text you. Pick a username and you are in — the whole thing takes under a minute. Never share that code with anyone; it is the one thing standing between your account and somebody else."
          }
        },
        {
          "@type": "Question",
          "name": "What does Xelvic cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nothing. Chatting, calling, voice notes, moments, drops, vibes, live rooms and music are all free to use. Sparks are the currency for cosmetic extras — themes and looks — and they change how the app looks rather than what it does. You earn Sparks by talking, and you can buy them as well."
          }
        },
        {
          "@type": "Question",
          "name": "What is the minimum age?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Xelvic is not for anyone under 13. Your date of birth is checked when you sign up — the sign-up will not complete below the line — and it stays on your account afterwards, because it is what says you are old enough for the 18+ content and what puts a birthday on your profile. Other people see the day and the month; the year stays yours unless you choose to show it."
          }
        },
        {
          "@type": "Question",
          "name": "How do I find my friends?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Allow contacts and everyone in your phone who is already on Xelvic shows up right away. We keep one row per number: a one-way hash of the number, and the name you saved it under, so the row can read “Bina” rather than a string of digits. Refuse, or turn it off later, and every one of those rows is deleted. If you would rather not share contacts at all, you can search for someone by their handle instead."
          }
        },
        {
          "@type": "Question",
          "name": "What is a handle, and can I change it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A handle is how people reach you — the name someone types to find you. You choose it at sign-up and you can change it later, but only about once a day, which keeps a handle meaning something rather than being a thing people swap to dodge a block."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Xelvic on a computer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can sign in from a browser, and when you do, the sign-in is confirmed on your phone first — the app asks you to press No if you did not just start it, so nobody gets in by guessing. Once you are in, the browser is yours until you sign it out from sessions."
          }
        },
        {
          "@type": "Question",
          "name": "Somebody already has the handle I wanted. What now?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Handles are first come, first served. If one is taken out from under you while you are choosing, the app offers another rather than leaving you stuck on an error screen. Add a display name on top of the handle if you want people to see something other than the username."
          }
        },
        {
          "@type": "Question",
          "name": "How do voice notes work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hold the mic to record. Slide up to lock it so you can let go and keep talking, or slide left to cancel. The recording stops on its own at 30 minutes, and the app tells you when it does rather than cutting you off silently."
          }
        },
        {
          "@type": "Question",
          "name": "What is a channel?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A channel is a room inside a group. Everybody in the group can read it, and whoever runs the group decides who can post: a channel set to announcements is read-only for everyone else, and the app says so on the screen rather than just refusing your message."
          }
        },
        {
          "@type": "Question",
          "name": "Do my messages send if I lose signal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Xelvic holds what you sent and delivers it the moment you are back. The one exception is signing a device out: messages and actions still waiting on that phone are discarded rather than delivered later from a device you no longer use."
          }
        },
        {
          "@type": "Question",
          "name": "What happens when I delete a call record?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It leaves your call log, and the other person keeps their own copy. Deleting a record tidies your own list; it is not a way to make a call disappear for both people, and the app says so rather than letting you assume otherwise."
          }
        },
        {
          "@type": "Question",
          "name": "How do I delete a message or a conversation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hold the message to remove it for everyone, or clear the convo to empty the thread on your side. If you want it out of your convo list entirely without losing it, move it into the Vault instead — it leaves the list and turns up behind your code."
          }
        },
        {
          "@type": "Question",
          "name": "Can I take a call while already on one?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The app tells you that you are already on a call rather than dropping the first one. Missed calls land in the same list as the ones you made, so nothing quietly disappears."
          }
        },
        {
          "@type": "Question",
          "name": "What happens to a group when I leave it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Everything goes with you: the channels, what was said in them, and your place in the group. Photos and videos sent there stop being reachable on your side. Getting back in is not automatic — somebody still inside has to add you back."
          }
        },
        {
          "@type": "Question",
          "name": "How do I add somebody to a group?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A group is you and at least one other person, and whoever runs it decides who is in. If somebody leaves, they need an invite back rather than being able to walk in — which is the point of the rule."
          }
        },
        {
          "@type": "Question",
          "name": "How long do Moments last?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A day. What you post turns up for the people who follow you and is gone from the feed tomorrow — and then it is kept in your Memories, on your profile, where who sees it follows your account exactly as your moments do."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between a Drop and a Vibe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A drop is a photo post and holds up to 10 pieces; it can be found by its words, its tag or its place. A Vibe is a video, and the app is blunt about what that means: a Vibe is public and stays up until you take it down. Post the one you are happy to have found."
          }
        },
        {
          "@type": "Question",
          "name": "Can I save something to come back to?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Drops, Vibes and songs you put by turn up in one place, along with what you played lately — so a thing you meant to return to does not have to be found again from scratch."
          }
        },
        {
          "@type": "Question",
          "name": "Who sees what I post?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "That follows your account. Keep it private and your moments stay inside the app, visible to the people you approved rather than to anyone who goes looking. A private profile also means your posts do not go into anyone else’s feed — make it public again and what you put up shows there."
          }
        },
        {
          "@type": "Question",
          "name": "How do I go live?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open Live, pick camera or text, and start whenever you are ready. It is announced to the people who follow you the moment you go, so nobody misses it by accident."
          }
        },
        {
          "@type": "Question",
          "name": "Who can talk in a room?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Anybody can walk in, but the host holds the room: they hand out the microphones, decide who speaks, and decide when it closes. A room you opened stays in your list afterwards, whether it was on, coming or over."
          }
        },
        {
          "@type": "Question",
          "name": "What are watch-together games?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In a room you can put a game on the board, and the board becomes the stream, so everyone watching sees the same game at the same time. Two of you can play while the rest of the room watches."
          }
        },
        {
          "@type": "Question",
          "name": "How do I take something down?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open the post and take it down. It stops being dealt into anybody’s feed, and it comes off the app for the people who were carrying it. If you are taking down a track or a playlist, it also goes off everybody it was sent to, including links that were already handed out — so take it down before you share it around."
          }
        },
        {
          "@type": "Question",
          "name": "What is a Spark?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A day two people talk on is one spark, and it does not matter who of you sent first. Nobody has one until the first line lands, and from then on every day you and a friend actually say something to each other keeps it going."
          }
        },
        {
          "@type": "Question",
          "name": "What is a Shield?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Shield covers a day you missed. Both of you have to say something before the day is out to keep a spark alive; miss one and a Shield takes the hit instead of the run. One banks each week, up to the cap the app shows you, so they are worth not spending carelessly."
          }
        },
        {
          "@type": "Question",
          "name": "Who can see my Spark?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can. \"Show my sparks\" is a setting, and your run stays yours — nobody else gets to watch it. What the other person does see is a screenshot: take one of a Spark and the app notes it on your screen and tells them their Spark was captured."
          }
        },
        {
          "@type": "Question",
          "name": "Does a group count towards a Spark?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. A one-to-one convo keeps its own spark; a group does not count towards it. That is deliberate — a spark is meant to be the two of you, not a room you happen to both be in."
          }
        },
        {
          "@type": "Question",
          "name": "What are Sparks spent on?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Themes, looks and cosmetics. A theme changes the character in your convos and the colour of the app; anything you buy applies to you rather than changing what anybody else sees. Themes can be changed or removed from Settings whenever you want."
          }
        },
        {
          "@type": "Question",
          "name": "A theme I wanted is not available. Why?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Themes are rotated, and an item can be pulled from sale. When that happens the app tells you rather than leaving a gap where the button was, and anything you already applied stays as it is."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Vault?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A private, encrypted space for the chats you want out of the way. Hold a convo in the list and choose \"Move to the vault\" — it leaves the list and turns up behind your code. Open it by typing that code where you would normally type a name, and it closes again on its own after a stretch."
          }
        },
        {
          "@type": "Question",
          "name": "What if I forget my vault code?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "There is no way to recover it — the app warns you when you set it, and that warning is real rather than boilerplate. Resetting the code is possible, but if you had a lock set, resetting deletes every chat inside the vault. Choose a code you will not lose."
          }
        },
        {
          "@type": "Question",
          "name": "Are my contacts uploaded?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Only if you allow it, and not in readable form. We keep one row per number — a one-way hash of the number, and the name you saved it under — which is what lets a match come back as “Bina” rather than a string of digits. We never keep the numbers themselves or a copy of the book, and turning contacts off deletes every row."
          }
        },
        {
          "@type": "Question",
          "name": "Can I make messages disappear?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Turn on a disappearing convo and messages clear themselves once they have been seen. Switching it on deletes everything already in the chat, for both people, so the app asks before it does it — that part is not reversible."
          }
        },
        {
          "@type": "Question",
          "name": "What happens when I block someone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "They cannot reach you, and neither of you sees the other online. The convo stays where it is rather than being deleted out from under either of you, and blocking is not announced — the other person simply stops being able to get through."
          }
        },
        {
          "@type": "Question",
          "name": "How do I report someone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open the profile, the message or the comment, choose report, and say what happened. It goes into a queue and a moderator reads it. Reporting the same thing twice is recognised rather than filed again, so you do not need to keep at it."
          }
        },
        {
          "@type": "Question",
          "name": "Does the other person know I reported them?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Nobody is told who reported them, and nothing happens to them on its own — a report starts a review, it is not an automatic punishment. Reporting a comment works the same way."
          }
        },
        {
          "@type": "Question",
          "name": "Are screenshots blocked?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No, and no app on a normal phone can block them. What Xelvic does instead is tell the truth about it: take a screenshot of a Spark and the app notes it on your screen and lets the other person know their Spark was captured."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between a comment and a note?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A comment is public under the post: everyone in the convo reads it, and every comment carries a heart and a Reply so an answer lands on that comment rather than loose in the thread. A note is private — the field says \"Write a private note\", and what you write goes to whoever put the post up rather than to everybody reading it."
          }
        },
        {
          "@type": "Question",
          "name": "How do I open comments and notes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every post in a convo carries its own count. Tap it and the sheet comes up over the conversation with Comments on one tab and Notes on the other, so you never have to leave the thread to say something about what is in it."
          }
        },
        {
          "@type": "Question",
          "name": "Can I turn comments off on my own post?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Comments can be switched off per post, and the app says so on the post rather than just hiding the button. Existing comments can be removed one at a time as well."
          }
        },
        {
          "@type": "Question",
          "name": "Can I remove a comment somebody left?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, from the comment itself. Removing it takes it off the post for everybody, and reporting it is a separate option if you want it looked at rather than just gone."
          }
        },
        {
          "@type": "Question",
          "name": "Can a note be a voice note?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. A note can be written or recorded — the composer offers both — which is often the faster way to say something longer than a line."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Xelvic on more than one phone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Scan a code to sign in on another device, and manage every phone you use from settings. Each one is listed separately, so you can see where the account is open."
          }
        },
        {
          "@type": "Question",
          "name": "How do I sign out everywhere?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In sessions, sign out of every phone but this one in a single press. The first device the account signed in on stays by design, because removing that one needs your password — it is the safety catch that stops somebody with a borrowed phone locking you out."
          }
        },
        {
          "@type": "Question",
          "name": "How do I change my password?",

        <p style="font-size:0.9rem;margin:0 0 1rem;opacity:0.7"><a href="/">Home</a> › Help Center</p>
        <h1 style="font-size:1.9rem;line-height:1.15;margin:0 0 0.5rem">Xelvic Help Center</h1>
        <p style="font-size:1.05rem;margin:0 0 1.25rem">Answers and how-tos for getting the most out of Xelvic — sign-up, chat and calls, Moments, Sparks, the Vault, reporting, and how to leave.</p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Getting started</h2>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do I create a Xelvic account?</strong><br />Download Xelvic, enter your phone number and confirm the one-time code we text you. Pick a username and you are in — the whole thing takes under a minute. Never share that code with anyone; it is the one thing standing between your account and somebody else.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What does Xelvic cost?</strong><br />Nothing. Chatting, calling, voice notes, moments, drops, vibes, live rooms and music are all free to use. Sparks are the currency for cosmetic extras — themes and looks — and they change how the app looks rather than what it does. You earn Sparks by talking, and you can buy them as well.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What is the minimum age?</strong><br />Xelvic is not for anyone under 13. Your date of birth is checked when you sign up — the sign-up will not complete below the line — and it stays on your account afterwards, because it is what says you are old enough for the 18+ content and what puts a birthday on your profile. Other people see the day and the month; the year stays yours unless you choose to show it.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do I find my friends?</strong><br />Allow contacts and everyone in your phone who is already on Xelvic shows up right away. We keep one row per number: a one-way hash of the number, and the name you saved it under, so the row can read “Bina” rather than a string of digits. Refuse, or turn it off later, and every one of those rows is deleted. If you would rather not share contacts at all, you can search for someone by their handle instead.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What is a handle, and can I change it?</strong><br />A handle is how people reach you — the name someone types to find you. You choose it at sign-up and you can change it later, but only about once a day, which keeps a handle meaning something rather than being a thing people swap to dodge a block.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Can I use Xelvic on a computer?</strong><br />You can sign in from a browser, and when you do, the sign-in is confirmed on your phone first — the app asks you to press No if you did not just start it, so nobody gets in by guessing. Once you are in, the browser is yours until you sign it out from sessions.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Somebody already has the handle I wanted. What now?</strong><br />Handles are first come, first served. If one is taken out from under you while you are choosing, the app offers another rather than leaving you stuck on an error screen. Add a display name on top of the handle if you want people to see something other than the username.</p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Messaging &amp; calls</h2>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do voice notes work?</strong><br />Hold the mic to record. Slide up to lock it so you can let go and keep talking, or slide left to cancel. The recording stops on its own at 30 minutes, and the app tells you when it does rather than cutting you off silently.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What is a channel?</strong><br />A channel is a room inside a group. Everybody in the group can read it, and whoever runs the group decides who can post: a channel set to announcements is read-only for everyone else, and the app says so on the screen rather than just refusing your message.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Do my messages send if I lose signal?</strong><br />Yes. Xelvic holds what you sent and delivers it the moment you are back. The one exception is signing a device out: messages and actions still waiting on that phone are discarded rather than delivered later from a device you no longer use.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What happens when I delete a call record?</strong><br />It leaves your call log, and the other person keeps their own copy. Deleting a record tidies your own list; it is not a way to make a call disappear for both people, and the app says so rather than letting you assume otherwise.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do I delete a message or a conversation?</strong><br />Hold the message to remove it for everyone, or clear the convo to empty the thread on your side. If you want it out of your convo list entirely without losing it, move it into the Vault instead — it leaves the list and turns up behind your code.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Can I take a call while already on one?</strong><br />No. The app tells you that you are already on a call rather than dropping the first one. Missed calls land in the same list as the ones you made, so nothing quietly disappears.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What happens to a group when I leave it?</strong><br />Everything goes with you: the channels, what was said in them, and your place in the group. Photos and videos sent there stop being reachable on your side. Getting back in is not automatic — somebody still inside has to add you back.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do I add somebody to a group?</strong><br />A group is you and at least one other person, and whoever runs it decides who is in. If somebody leaves, they need an invite back rather than being able to walk in — which is the point of the rule.</p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Moments, Live &amp; Rooms</h2>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How long do Moments last?</strong><br />A day. What you post turns up for the people who follow you and is gone from the feed tomorrow — and then it is kept in your Memories, on your profile, where who sees it follows your account exactly as your moments do.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What is the difference between a Drop and a Vibe?</strong><br />A drop is a photo post and holds up to 10 pieces; it can be found by its words, its tag or its place. A Vibe is a video, and the app is blunt about what that means: a Vibe is public and stays up until you take it down. Post the one you are happy to have found.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Can I save something to come back to?</strong><br />Yes. Drops, Vibes and songs you put by turn up in one place, along with what you played lately — so a thing you meant to return to does not have to be found again from scratch.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Who sees what I post?</strong><br />That follows your account. Keep it private and your moments stay inside the app, visible to the people you approved rather than to anyone who goes looking. A private profile also means your posts do not go into anyone else’s feed — make it public again and what you put up shows there.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do I go live?</strong><br />Open Live, pick camera or text, and start whenever you are ready. It is announced to the people who follow you the moment you go, so nobody misses it by accident.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Who can talk in a room?</strong><br />Anybody can walk in, but the host holds the room: they hand out the microphones, decide who speaks, and decide when it closes. A room you opened stays in your list afterwards, whether it was on, coming or over.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What are watch-together games?</strong><br />In a room you can put a game on the board, and the board becomes the stream, so everyone watching sees the same game at the same time. Two of you can play while the rest of the room watches.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do I take something down?</strong><br />Open the post and take it down. It stops being dealt into anybody’s feed, and it comes off the app for the people who were carrying it. If you are taking down a track or a playlist, it also goes off everybody it was sent to, including links that were already handed out — so take it down before you share it around.</p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Sparks, Drip &amp; themes</h2>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What is a Spark?</strong><br />A day two people talk on is one spark, and it does not matter who of you sent first. Nobody has one until the first line lands, and from then on every day you and a friend actually say something to each other keeps it going.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What is a Shield?</strong><br />A Shield covers a day you missed. Both of you have to say something before the day is out to keep a spark alive; miss one and a Shield takes the hit instead of the run. One banks each week, up to the cap the app shows you, so they are worth not spending carelessly.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Who can see my Spark?</strong><br />You can. &quot;Show my sparks&quot; is a setting, and your run stays yours — nobody else gets to watch it. What the other person does see is a screenshot: take one of a Spark and the app notes it on your screen and tells them their Spark was captured.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Does a group count towards a Spark?</strong><br />No. A one-to-one convo keeps its own spark; a group does not count towards it. That is deliberate — a spark is meant to be the two of you, not a room you happen to both be in.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What are Sparks spent on?</strong><br />Themes, looks and cosmetics. A theme changes the character in your convos and the colour of the app; anything you buy applies to you rather than changing what anybody else sees. Themes can be changed or removed from Settings whenever you want.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>A theme I wanted is not available. Why?</strong><br />Themes are rotated, and an item can be pulled from sale. When that happens the app tells you rather than leaving a gap where the button was, and anything you already applied stays as it is.</p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Privacy &amp; safety</h2>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What is the Vault?</strong><br />A private, encrypted space for the chats you want out of the way. Hold a convo in the list and choose &quot;Move to the vault&quot; — it leaves the list and turns up behind your code. Open it by typing that code where you would normally type a name, and it closes again on its own after a stretch.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What if I forget my vault code?</strong><br />There is no way to recover it — the app warns you when you set it, and that warning is real rather than boilerplate. Resetting the code is possible, but if you had a lock set, resetting deletes every chat inside the vault. Choose a code you will not lose.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Are my contacts uploaded?</strong><br />Only if you allow it, and not in readable form. We keep one row per number — a one-way hash of the number, and the name you saved it under — which is what lets a match come back as “Bina” rather than a string of digits. We never keep the numbers themselves or a copy of the book, and turning contacts off deletes every row.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Can I make messages disappear?</strong><br />Yes. Turn on a disappearing convo and messages clear themselves once they have been seen. Switching it on deletes everything already in the chat, for both people, so the app asks before it does it — that part is not reversible.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What happens when I block someone?</strong><br />They cannot reach you, and neither of you sees the other online. The convo stays where it is rather than being deleted out from under either of you, and blocking is not announced — the other person simply stops being able to get through.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do I report someone?</strong><br />Open the profile, the message or the comment, choose report, and say what happened. It goes into a queue and a moderator reads it. Reporting the same thing twice is recognised rather than filed again, so you do not need to keep at it.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Does the other person know I reported them?</strong><br />No. Nobody is told who reported them, and nothing happens to them on its own — a report starts a review, it is not an automatic punishment. Reporting a comment works the same way.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Are screenshots blocked?</strong><br />No, and no app on a normal phone can block them. What Xelvic does instead is tell the truth about it: take a screenshot of a Spark and the app notes it on your screen and lets the other person know their Spark was captured.</p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Comments &amp; notes</h2>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What is the difference between a comment and a note?</strong><br />A comment is public under the post: everyone in the convo reads it, and every comment carries a heart and a Reply so an answer lands on that comment rather than loose in the thread. A note is private — the field says &quot;Write a private note&quot;, and what you write goes to whoever put the post up rather than to everybody reading it.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do I open comments and notes?</strong><br />Every post in a convo carries its own count. Tap it and the sheet comes up over the conversation with Comments on one tab and Notes on the other, so you never have to leave the thread to say something about what is in it.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Can I turn comments off on my own post?</strong><br />Yes. Comments can be switched off per post, and the app says so on the post rather than just hiding the button. Existing comments can be removed one at a time as well.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Can I remove a comment somebody left?</strong><br />Yes, from the comment itself. Removing it takes it off the post for everybody, and reporting it is a separate option if you want it looked at rather than just gone.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Can a note be a voice note?</strong><br />Yes. A note can be written or recorded — the composer offers both — which is often the faster way to say something longer than a line.</p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Account &amp; devices</h2>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Can I use Xelvic on more than one phone?</strong><br />Yes. Scan a code to sign in on another device, and manage every phone you use from settings. Each one is listed separately, so you can see where the account is open.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do I sign out everywhere?</strong><br />In sessions, sign out of every phone but this one in a single press. The first device the account signed in on stays by design, because removing that one needs your password — it is the safety catch that stops somebody with a borrowed phone locking you out.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>How do I change my password?</strong><br />From settings. If you have forgotten it, the reset asks for your account password first — and the reset only happens if it is correct, so nobody can wipe your account by claiming to be you. Never share a one-time code with anyone, including somebody claiming to be from Xelvic.</p>

        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What happens when I delete my account?</strong><br />It is hidden straight away, so nobody can find you or message you, and the account is then kept for 30 days in case you change your mind — sign back in during that window and everything returns exactly as it was. After 30 days it is deleted permanently, along with your profile and everything you posted, and it cannot be recovered.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>Can I recover an account I deleted months ago?</strong><br />No. Past the 30 days there is no route back, for you or for us, which is why the window exists at all — it is the last chance to change your mind rather than a promise that deletion is reversible.</p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Creators &amp; deals</h2>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><strong>What is a deal?</strong><br />A deal is a paid collaboration between a brand and a creator. You are told what the deal is asking for before you take it on, so you know what you are agreeing to rather than finding out from a brief afterwards.</p>
