        <h1 style="font-size:1.9rem;line-height:1.15;margin:0 0 0.5rem">Drops &amp; Vibes — Your feed, your frame</h1>
        <p style="font-size:1.05rem;margin:0 0 1.25rem">Post photo Drops and short-video Vibes. Feel them, leave notes, and find more of what you are into.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><em>Your feed, your frame</em></p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">What it does</h2>
        <ul style="margin:0;padding-left:1.15rem">
          <li><strong>Drops</strong> — Photo posts — every picture in a drop is posted at this one frame.</li>
          <li><strong>Vibes</strong> — Short-video reels with voice and music, built for the scroll.</li>
          <li><strong>Feels &amp; notes</strong> — Feel a post with the heart, and leave a note right on it.</li>
          <li><strong>Tuned to you</strong> — Pick interests and your feed follows along.</li>
        </ul>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Where to tap</h2>
        <ol style="margin:0;padding-left:1.15rem">
          <li><strong>Tap ＋ in the feed</strong> — Choose a Drop (photos) or a Vibe (short video with voice &amp; music).</li>
          <li><strong>Pick your frame</strong> — Every picture in a Drop is pinned at the same frame so your grid stays clean.</li>
          <li><strong>Add music to a Vibe</strong> — Lay a track under your clip and let it loop for the scroll.</li>
          <li><strong>Share &amp; get notes</strong> — People react, reply and leave little notes right on your post.</li>
        </ol>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Worth knowing</h2>
        <ul style="margin:0;padding-left:1.15rem">
          <li>Pick your interests in Explore and your feed tunes itself to you.</li>
          <li>Tap the heart to feel a post; long-press to save it for later.</li>
          <li>Drops from the people you follow surface at the top of the feed.</li>
