        <noscript>
      <div style="max-width:44rem;margin:0 auto;padding:2rem 1.25rem 4rem;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.65;color:#3a0a24">
        <p style="font-size:0.9rem;margin:0 0 1rem;opacity:0.7"><a href="/">Home</a> › <a href="/features">Features</a> › Live &amp; Rooms</p>
        <h1 style="font-size:1.9rem;line-height:1.15;margin:0 0 0.5rem">Live &amp; Rooms — Go live. Hold the room.</h1>
        <p style="font-size:1.05rem;margin:0 0 1.25rem">Stream live by camera or text, or open an audio room where you hand out the mics — and even watch a game together.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><em>Go live. Hold the room.</em></p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">What it does</h2>
        <ul style="margin:0;padding-left:1.15rem">
          <li><strong>Go live your way</strong> — Camera live, text live — announced to everyone who follows you.</li>
          <li><strong>Audio rooms</strong> — You open it, hand out mics, and you are the one who closes it.</li>
          <li><strong>Watch together</strong> — Pick a game and the board becomes the stream — everyone sees the same thing.</li>
          <li><strong>Host controls</strong> — Full moderation so your room stays yours.</li>
        </ul>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Where to tap</h2>
        <ol style="margin:0;padding-left:1.15rem">
          <li><strong>Open the Live tab</strong> — See who is live right now, or start your own broadcast.</li>
          <li><strong>Tap Go Live</strong> — Choose Camera live, Text live, or open an Audio room. Followers get a ping.</li>
          <li><strong>Hand out the mic 🎤</strong> — In an audio room you are the host — tap a listener to invite them up to speak.</li>
          <li><strong>Start Watch Together</strong> — Pick a game and the board becomes the stream so everyone sees the same thing.</li>
        </ol>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Worth knowing</h2>
        <ul style="margin:0;padding-left:1.15rem">
          <li>You opened the room, so you close it — full host moderation is built in.</li>
          <li>Remove or mute anyone with a tap on their avatar.</li>
          <li>Comments and reactions float up live along the bottom of the screen.</li>
        </ul>
