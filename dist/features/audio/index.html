        <p style="font-size:1.05rem;margin:0 0 1.25rem">Stream tracks, build playlists, follow the charts and share a song straight into any chat — online or off.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><em>A soundtrack for every mood</em></p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">What it does</h2>
        <ul style="margin:0;padding-left:1.15rem">
