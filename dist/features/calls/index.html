        <h1 style="font-size:1.9rem;line-height:1.15;margin:0 0 0.5rem">Voice &amp; Video Calls — Crisp calls, powered by WebRTC</h1>
        <p style="font-size:1.05rem;margin:0 0 1.25rem">Peer-to-peer voice and video built on WebRTC for low-latency calls that hold up even on shaky networks.</p>
        <p style="font-size:1.05rem;margin:0 0 1.25rem"><em>Crisp calls, powered by WebRTC</em></p>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">What it does</h2>
        <ul style="margin:0;padding-left:1.15rem">
          <li><strong>Add people on the fly</strong> — Pull friends into an ongoing call with a tap.</li>
          <li><strong>Encrypted media</strong> — Call media is encrypted in transit, so nothing sitting on the network path can listen in.</li>
          <li><strong>Call history</strong> — Every call you make or miss is kept neatly in one place.</li>
          <li><strong>Works everywhere</strong> — Calls and messages follow you across every screen in the app.</li>
        </ul>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Where to tap</h2>
        <ol style="margin:0;padding-left:1.15rem">
          <li><strong>Open any conversation</strong> — The phone 📞 (voice) and camera 🎥 (video) icons sit in the top-right header.</li>
          <li><strong>Tap 📞 or 🎥 to ring</strong> — The call connects peer-to-peer over WebRTC for low-latency, encrypted media.</li>
          <li><strong>Tap ＋ during a call</strong> — Pull more friends into an ongoing call without hanging up.</li>
          <li><strong>Check the Calls tab</strong> — Every call you make or miss is kept neatly, with a tap to call back.</li>
        </ol>

        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">Worth knowing</h2>
        <ul style="margin:0;padding-left:1.15rem">
          <li>Calls hold up on shaky networks — quality adapts automatically.</li>
          <li>Flip between front/back camera with the ↺ icon mid-call.</li>
          <li>Mute, video-off and speaker controls live along the bottom bar.</li>
        </ul>
