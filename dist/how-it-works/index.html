        <noscript>
      <div style="max-width:44rem;margin:0 auto;padding:2rem 1.25rem 4rem;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.65;color:#3a0a24">

        <h1 style="font-size:1.9rem;line-height:1.15;margin:0 0 0.5rem">How Xelvic works</h1>
        <p style="font-size:1.05rem;margin:0 0 1.25rem">From your first hello to going live: the five steps to set up Xelvic — create an account, find your people, start a chat or a call, post a Drop, and make it yours.</p>
        <h2 style="font-size:1.15rem;margin:1.75rem 0 0.5rem">The five steps</h2>
        <ol style="margin:0;padding-left:1.15rem">
          <li><strong>Create your account</strong> — Enter your phone number, confirm the one-time code we text you, and pick a username. No email, no fuss — the whole thing takes under a minute. In the app: Open Xelvic → Enter number → Confirm code → Pick a @username.</li>
          <li><strong>Find your people</strong> — Allow contacts and everyone already on Xelvic shows up right away — each number is kept only as a one-way hash, with the name you saved it under. Prefer to search? Find anyone by name or @handle. In the app: Allow contacts → See who is on Xelvic → or Search by @handle.</li>
          <li><strong>Start talking</strong> — Send a message, hold the mic for a voice note, or tap the phone and camera icons to start a voice or video call. Everything is offline-first, so your messages always get there. In the app: Open a chat → Type or hold 🎤 → Tap 📞 / 🎥 to call.</li>
          <li><strong>Share your day</strong> — Post a Moment, drop a photo, or go Live. What you share with the people you follow turns up today and becomes a Memory tomorrow. In the app: Tap your avatar + → Add text / music / poll → Post — lasts 24h.</li>
          <li><strong>Make it yours</strong> — Flip into any of 50+ themes, set a chat wallpaper, and dress your profile in Drip. Keep a spark going with a friend — both of you say something before the day is out — to unlock even more. In the app: Profile → Settings ⚙️ → Appearance → Themes → Pick a look &amp; apply.</li>
        </ol>
